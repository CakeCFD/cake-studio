name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          curl -fsSL https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config \
            qtbase5-dev libqt5opengl5-dev \
            libvtk9-dev libvtk9-qt-dev \
            libocct-data-exchange-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-visualization-dev \
            libjsoncpp-dev libyaml-cpp-dev \
            openfoam2412-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Build TENO scheme library
        shell: bash
        run: |
          source /usr/lib/openfoam/openfoam2412/etc/bashrc || true
          cd src/solver/schemes/TENO
          wmake libso
