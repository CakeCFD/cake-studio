name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach assets to, for example v0.1.0
        required: true
      ref:
        description: Commit or branch to build from (defaults to the tag)
        required: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  SRC: ${{ inputs.ref || inputs.tag || github.ref_name }}

jobs:
  linux:
    strategy:
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC }}

      - uses: actions/cache/restore@v4
        id: apt-cache
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.arch }}-v1

      - name: Restore apt packages
        run: |
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          mkdir -p ~/apt-debs
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true

      - name: Install dependencies
        run: |
          curl -fsSL https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config \
            qtbase5-dev libqt5opengl5-dev \
            libvtk9-dev libvtk9-qt-dev \
            libocct-data-exchange-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-visualization-dev \
            libjsoncpp-dev libyaml-cpp-dev \
            openfoam2412-dev

      - name: Save apt packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: cp /var/cache/apt/archives/*.deb ~/apt-debs/

      - uses: actions/cache/save@v4
        if: steps.apt-cache.outputs.cache-hit != 'true'
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.arch }}-v1

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Build TENO library and package
        shell: bash
        run: |
          source /usr/lib/openfoam/openfoam2412/etc/bashrc || true
          (cd src/solver/schemes/TENO && wmake libso)
          bash packaging/linux/package.sh "${TAG#v}" dist

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "CakeStudio $TAG" --notes "" || true
          gh release upload "$TAG" dist/*.tar.gz packaging/linux/install.sh --clobber

  windows:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC }}

      - name: Build installer
        shell: cmd
        run: packaging\windows\build-setup.cmd %TAG%

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" packaging/windows/dist/CakeStudioSetup.exe --clobber
