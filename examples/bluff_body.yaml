geometry:
  file: tests/cad_test/bluff_body.step   # path relative to project root

case:
  name: bluff_body
  output_dir: runs

solver:
  type: simpleFoam
  turbulence: kOmegaSST
  inflow_velocity: 20.0
  nu: 1.5e-5

mesh:
  padding: 2.0
  background_cells: 20
  max_global_cells: 3000000
  max_local_cells: 100000
  surface_refinement_min: 2
  surface_refinement_max: 3
  resolve_feature_angle: 30
  boundary_layers: 2
  layer_expansion_ratio: 1.2
  first_layer_thickness: 0.3
  min_thickness: 0.1

run:
  mesh: true
  solver: false
  cores: 4
